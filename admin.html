<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MAWJA Dashboard</title>
<link rel="icon" href="brand/mawja-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ocean:#062F43;--ocean2:#0A3E52;--sand:#E7D5BB;--teal:#0C6F70;--line:rgba(231,213,187,.18);--mute:rgba(231,213,187,.7);--err:#ffb4a8;
  --serif:"Cormorant Garamond","Noto Sans Arabic",Georgia,serif;--sans:"DM Sans","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ocean);color:var(--sand);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img,video{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.1}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:4px;border:1px solid transparent;font-weight:500;font-size:14px;white-space:nowrap}
.btn-sand{background:var(--sand);color:var(--ocean)}
.btn-teal{background:var(--teal);color:var(--sand)}
.btn-line{border-color:var(--line);background:transparent}
.btn-line:hover{border-color:var(--sand)}
.btn-danger{border-color:rgba(255,180,168,.4);color:var(--err);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{min-height:34px;padding:5px 12px;font-size:13px}
label.f{display:block}
label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.in{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--ocean);color:var(--sand);outline:none}
.in:focus{border-color:var(--sand)}
select.in{appearance:auto}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.err{color:var(--err);font-size:14px}
.ok{color:#9fe0c9;font-size:14px}
.card{background:var(--ocean2);border:1px solid var(--line);border-radius:6px;padding:18px}
.grid2{display:grid;gap:14px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{width:100%;max-width:380px;display:grid;gap:14px}
.login img{height:26px;width:auto;margin-bottom:6px}
/* App */
.top{position:sticky;top:0;z-index:20;background:var(--ocean);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
.top img{height:22px;width:auto}
.top .acts{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tab{padding:8px 14px;border-radius:4px;border:1px solid var(--line);background:transparent;white-space:nowrap;font-size:14px}
.tab[aria-selected=true]{background:var(--sand);color:var(--ocean);border-color:var(--sand)}
main{padding:22px 0 120px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:34px}
.sec-h p{color:var(--mute);font-size:14px;max-width:62ch}
.stack{display:grid;gap:14px}
.thumb{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--ocean);border:1px solid var(--line);border-radius:4px}
.pick{display:grid;gap:8px}
.pick .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* Product editor */
details.prod{background:var(--ocean2);border:1px solid var(--line);border-radius:6px}
details.prod>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
details.prod>summary::-webkit-details-marker{display:none}
details.prod>summary img{width:52px;height:52px;object-fit:contain;background:var(--ocean);border-radius:4px;flex-shrink:0}
details.prod>summary .nm{font-family:var(--serif);font-size:22px;line-height:1.1}
details.prod>summary .sub{font-size:12.5px;color:var(--mute)}
details.prod>summary .grow{flex:1;min-width:0}
details.prod>summary .chev{transition:transform .2s;opacity:.7}
details.prod[open]>summary .chev{transform:rotate(180deg)}
.pbody{padding:4px 14px 16px;display:grid;gap:16px;border-top:1px solid var(--line)}
.pbody .imgs{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.pbody .imgs .thumb{max-width:220px}
table.sz{width:100%;border-collapse:collapse}
table.sz th{font-weight:500;font-size:12.5px;color:var(--mute);text-align:start;padding:0 6px 6px}
table.sz td{padding:4px 6px;vertical-align:middle}
table.sz td:first-child{font-weight:600;white-space:nowrap;padding-inline-start:0}
table.sz .in{min-height:38px;padding:6px 10px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--teal)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.badge{font-size:11.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.badge.off{border-color:rgba(255,180,168,.4);color:var(--err)}
/* Offers */
.olist{display:grid;gap:8px}
@media(min-width:720px){.olist{grid-template-columns:1fr 1fr}}
.oitem{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ocean2);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.oitem img{width:46px;height:46px;object-fit:contain;background:var(--ocean);border-radius:4px}
/* Videos */
.vitem{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.vitem{grid-template-columns:240px 1fr}}
.vgrip{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;gap:6px}
.pgrip{font-size:22px;line-height:1;padding:8px 6px;color:var(--mute);margin:-8px 0}
details.prod.dragging,details.prod.dropbefore,details.prod.dropafter{position:relative}
details.prod.dragging{z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.45);outline:2px solid var(--teal,#0C6F70)}
details.prod.dropbefore::before,details.prod.dropafter::after{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#4fd1c5}
details.prod.dropbefore::before{top:-9px}details.prod.dropafter::after{bottom:-9px}
.vgrip:active{cursor:grabbing}
.vitem{position:relative}
.vitem.dragging{z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.45);opacity:.96;outline:2px solid var(--teal,#0C6F70);transition:none}
.vitem.dropbefore::before,.vitem.dropafter::after{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#4fd1c5}
.vitem.dropbefore::before{top:-9px}.vitem.dropafter::after{bottom:-9px}
body.vdragging{user-select:none;-webkit-user-select:none}
.vitem video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:4px}
/* Save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ocean2);border-top:1px solid var(--line)}
.savebar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.status{font-size:14px;color:var(--mute)}
.status.dirty{color:var(--sand)}
.busy{position:fixed;inset:0;z-index:50;background:rgba(6,47,67,.7);display:flex;align-items:center;justify-content:center;font-size:16px}
textarea.in{resize:vertical;line-height:1.5}
.tab .badge{margin-inline-start:6px;background:var(--sand);color:var(--ocean);border-color:var(--sand);font-weight:600}
.tab[aria-selected=true] .badge{background:var(--ocean);color:var(--sand);border-color:var(--ocean)}
/* Orders */
details.ord{background:var(--ocean2);border:1px solid var(--line);border-radius:6px}
details.ord>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
details.ord>summary::-webkit-details-marker{display:none}
details.ord .no{font-family:var(--serif);font-size:24px;line-height:1.1}
details.ord .grow{flex:1;min-width:150px}
details.ord .sub{font-size:12.5px;color:var(--mute)}
details.ord .chev{transition:transform .2s;opacity:.7}
details.ord[open] .chev{transform:rotate(180deg)}
.obody{padding:4px 14px 16px;display:grid;gap:14px;border-top:1px solid var(--line)}
.obody .kv{display:grid;gap:3px;font-size:14px}
.obody .kv span.k{font-size:12.5px;color:var(--mute)}
.obody .addr{white-space:pre-line;overflow-wrap:anywhere}
table.oi{width:100%;border-collapse:collapse;font-size:14px}
table.oi th{font-weight:500;font-size:12.5px;color:var(--mute);text-align:start;padding:0 6px 6px}
table.oi td{padding:5px 6px;border-top:1px solid var(--line)}
table.oi td.n,table.oi th.n{text-align:end;white-space:nowrap}
.otot{display:grid;gap:3px;justify-self:end;min-width:220px;font-size:14px}
.otot div{display:flex;justify-content:space-between;gap:16px}
.otot .t{font-weight:600;font-size:16px}
.st-new{border-color:var(--sand);color:var(--sand)}
.st-confirming{border-color:#e8c26a;color:#e8c26a}
.st-confirmed{border-color:#7fd1c3;color:#7fd1c3}
.st-completed{border-color:#9fe0c9;color:#9fe0c9}
.st-cancelled{border-color:rgba(255,180,168,.4);color:var(--err)}
.ofil{padding:0 0 12px}
@media(max-width:560px){.top .hide-sm{display:none}.sec-h h2{font-size:28px}.pbody .imgs{grid-template-columns:1fr}}

.ord summary{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ctx{position:fixed;z-index:60;background:var(--ocean2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:150px}
.ctx button{display:block;width:100%;background:none;border:0;color:#ff5a5f;font:inherit;font-size:15px;padding:10px 14px;text-align:right;cursor:pointer;border-radius:8px}
.ctx button:hover{background:rgba(255,90,95,.12)}
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--ocean2);border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;padding:22px;direction:rtl;text-align:right}
.dlg h3{margin:0 0 10px;font-size:20px}
.dlg p{margin:6px 0}
.dlg .warn{color:#ff5a5f;font-size:15px}
.dlg .row{display:flex;gap:10px;margin-top:18px}
.dlg .row button{flex:1;padding:12px;border-radius:10px;font:inherit;cursor:pointer}
.dlg .del{background:#ff5a5f;border:0;color:#fff;font-weight:600}
.dlg .cancel{background:none;border:1px solid var(--line);color:inherit}
</style>
</head>
<body>

<!-- Sign in -->
<section class="login" id="loginView" hidden>
  <form id="loginForm" class="card">
    <img src="brand/mawja-logo-beige.png" alt="MAWJA" width="988" height="155">
    <h1 style="font-size:32px">Dashboard sign in</h1>
    <label class="f"><span>Email</span><input class="in" type="email" id="email" autocomplete="email" required></label>
    <label class="f"><span>Password</span><input class="in" type="password" id="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button class="btn btn-sand" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<!-- Dashboard -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap top-in">
      <img src="brand/mawja-logo-beige.png" alt="MAWJA" width="988" height="155">
      <div class="acts">
        <a class="btn btn-line btn-sm" href="/" target="_blank" rel="noopener">View site ↗</a>
        <a class="btn btn-line btn-sm" href="/api/admin/export" download="mawja-backup.json">Download backup</a>
        <span class="hide-sm status" id="who"></span>
        <button class="btn btn-line btn-sm" id="signOut" type="button">Sign out</button>
      </div>
    </div>
    <div class="wrap"><nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="banner">Banner</button>
      <button class="tab" role="tab" data-tab="products">Products</button>
      <button class="tab" role="tab" data-tab="offers">Now's offers</button>
      <button class="tab" role="tab" data-tab="reviews">Reviews</button>
      <button class="tab" role="tab" data-tab="shipping">Shipping</button>
      <button class="tab" role="tab" data-tab="orders">Orders<span class="badge" id="ordersBadge" hidden>0</span></button>
    </nav></div>
  </header>
  <main><div class="wrap" id="panel"></div></main>
  <div class="savebar"><div class="wrap">
    <span class="status" id="saveStatus" role="status" aria-live="polite">All changes saved.</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-line" id="discardBtn" type="button" disabled>Discard changes</button>
      <button class="btn btn-sand" id="saveBtn" type="button" disabled>Save &amp; publish</button>
    </div>
  </div></div>
</div>

<div class="busy" id="busy" hidden><span id="busyMsg">Working…</span></div>

<script>
/* MAWJA dashboard. Edits the catalog saved in the site database (Cloudflare D1).
   Sign-in uses the site own login (/api/admin). */
const API = "/api/admin";
async function api(path, opt) {
  const r = await fetch(`${API}/${path}`, { cache: "no-store", credentials: "same-origin", ...(opt || {}) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((j && j.error) || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}
const SIZES = [55, 35, 10];
const PAGES = [["#shop", "Shop (all fragrances)"], ["#offers", "Now's offers"], ["#men", "Men"], ["#women", "Women"], ["#unisex", "Unisex"], ["#best", "Best sellers"], ["#reviews", "Customer reviews"], ["#story", "Our story"]];

const GOVERNORATES = ["القاهرة", "الجيزة", "الإسكندرية", "القليوبية", "الشرقية", "الدقهلية", "الغربية", "المنوفية", "البحيرة", "كفر الشيخ", "دمياط", "بورسعيد", "الإسماعيلية", "السويس", "الفيوم", "بني سويف", "المنيا", "أسيوط", "سوهاج", "قنا", "الأقصر", "أسوان", "البحر الأحمر", "الوادي الجديد", "مطروح", "شمال سيناء", "جنوب سيناء"];
const CAT_LABEL = { men: "Men", women: "Women", unisex: "Unisex" };
const catOf = c => (c === "women" || c === "unisex" ? c : "men");
const STATUSES = [["new", "New", "جديد"], ["confirming", "Confirming", "جارٍ التأكيد"], ["confirmed", "Confirmed", "مؤكد"], ["completed", "Completed", "مكتمل"], ["cancelled", "Cancelled", "ملغي"]];
const statusLabel = v => { const x = STATUSES.find(r => r[0] === v); return x ? `${x[1]} · ${x[2]}` : v; };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

let data = null, saved = "", tab = "banner";
let orders = null, ordersErr = "", ordersLoading = false, ordersFilter = "all", ordersTimer = null;
const ordersOpen = new Set();

function busy(msg) { $("#busyMsg").textContent = msg || "Working…"; $("#busy").hidden = !msg; }
function show(view) { $("#loginView").hidden = view !== "login"; $("#appView").hidden = view !== "app"; }

/* ---------- Auth ---------- */
async function boot() {
  try { const m = await api("me"); await enter({ email: m.email }); }
  catch (e) { show("login"); }
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#loginErr"); err.hidden = true;
  $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Signing in…";
  let r = null, fail = "";
  try { r = await api("login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#email").value.trim(), password: $("#password").value }) }); }
  catch (e) { fail = e.status === 429 ? "Too many attempts. Wait 15 minutes and try again." : "Incorrect email or password."; }
  $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Sign in";
  if (!r) { err.hidden = false; err.textContent = fail; return; }
  $("#password").value = "";
  await enter({ email: r.email });
});
$("#signOut").addEventListener("click", async () => {
  if (dirty() && !confirm("You have unsaved changes. Sign out anyway?")) return;
  await api("logout", { method: "POST" }).catch(() => {}); data = null; saved = ""; orders = null; ordersErr = ""; clearInterval(ordersTimer); show("login");
});
async function enter(user) {
  busy("Loading…");
  $("#who").textContent = user.email || "";
  try { data = normalize(await loadData()); }
  catch (e) { busy(); alert("Could not load the store data: " + e.message); return; }
  saved = JSON.stringify(data);
  busy(); show("app"); setTab(tab); refreshBar();
  loadOrders(true);
  clearInterval(ordersTimer);
  ordersTimer = setInterval(() => { if (!$("#appView").hidden && !ordersLoading) loadOrders(true); }, 60000);
}

/* ---------- Data ---------- */
async function loadData() {
  const r = await fetch(`${API}/catalog`, { cache: "no-store", credentials: "same-origin" });
  if (r.ok) return r.json();
  if (r.status === 401) throw new Error("Session expired. Reload and sign in again.");
  if (r.status !== 400 && r.status !== 404) throw new Error(`HTTP ${r.status}`);
  return loadSiteDefaults();
}
// Reads the built-in values from index.html (same origin) in a hidden frame.
function loadSiteDefaults() {
  return new Promise((resolve, reject) => {
    const f = document.createElement("iframe");
    f.hidden = true; f.src = "/?defaults=1";
    const fail = setTimeout(() => { f.remove(); reject(new Error("timed out reading index.html")); }, 15000);
    f.onload = () => {
      try {
        const d = JSON.parse(f.contentWindow.eval("JSON.stringify({banner: BANNER, products: PRODUCTS, offers: NOW_OFFERS, reviews: REVIEW_VIDEOS.filter(v => v.src)})"));
        clearTimeout(fail); f.remove(); resolve(d);
      } catch (e) { clearTimeout(fail); f.remove(); reject(e); }
    };
    document.body.appendChild(f);
  });
}
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  const b = d.banner || {};
  const products = (Array.isArray(d.products) ? d.products : []).map(p => {
    const prices = {}, available = {};
    SIZES.forEach(s => {
      const P = (p.prices && p.prices[s]) || {};
      prices[s] = { before: typeof P.before === "number" ? P.before : null, now: typeof P.now === "number" ? P.now : null };
      available[s] = !(p.available && p.available[s] === false);
    });
    return { slug: String(p.slug || ""), name: String(p.name || ""), ref: String(p.ref || ""), cat: catOf(p.cat),
      img: String(p.img || ""), img2: String(p.img2 || p.img || ""), featured: !!p.featured, prices, available,
      notes: String(p.notes || ""), notesAr: String(p.notesAr || ""),
      priority: typeof p.priority === "number" && isFinite(p.priority) && p.priority >= 0 ? p.priority : null };
  });
  // Products saved before priorities existed keep their current order (position + 1). Same rule as the site.
  products.forEach((p, i) => { if (p.priority == null) p.priority = i + 1; });
  products.sort((a, b) => a.priority - b.priority);
  return {
    version: 1,
    banner: { image: String(b.image || ""), alt: String(b.alt || ""), href: String(b.href || "#shop") },
    products,
    shipping: (Array.isArray(d.shipping) ? d.shipping : []).filter(z => z && typeof z.name === "string")
      .map(z => ({ name: z.name, fee: typeof z.fee === "number" && isFinite(z.fee) && z.fee >= 0 ? z.fee : null })),
    offers: (Array.isArray(d.offers) ? d.offers : []).filter(s => products.some(p => p.slug === s)),
    reviews: (Array.isArray(d.reviews) ? d.reviews : []).filter(v => v && v.src).map(v => ({ type: v.type === "image" ? "image" : "video", src: String(v.src), poster: String(v.poster || ""), title: String(v.title || "") })),
  };
}
const dirty = () => data && JSON.stringify(data) !== saved;
// Stable sort by display priority (an empty priority goes last while typing).
function sortProducts() {
  const pr = p => (typeof p.priority === "number" ? p.priority : Infinity);
  data.products = data.products.map((p, i) => [p, i]).sort((a, b) => (pr(a[0]) - pr(b[0])) || (a[1] - b[1])).map(x => x[0]);
}
function refreshBar(msg, cls) {
  const st = $("#saveStatus");
  const d = dirty();
  st.textContent = msg || (d ? "You have unsaved changes." : "All changes saved.");
  st.className = "status" + (cls ? " " + cls : d ? " dirty" : "");
  $("#saveBtn").disabled = !d; $("#discardBtn").disabled = !d;
  document.querySelector(".savebar").hidden = tab === "orders" && !d;   // nothing to save on the Orders tab
}

/* Must match the checks in index.html, otherwise the site would ignore the saved value. */
const okSrc = s => /^(https:\/\/[^\s"'<>]+|(demo|brand|media)\/[\w.\-\/]+)$/.test(s || "");
const okHref = h => /^(#[\w-]*|https?:\/\/[^\s"'<>]+)$/.test(h || "");
function validate() {
  const errs = [];
  if (!okSrc(data.banner.image)) errs.push("Banner: upload an image.");
  if (!okHref(data.banner.href)) errs.push("Banner: the link must be a site page (like #shop) or a full link starting with https://");
  if (!data.products.length) errs.push("Add at least one product.");
  data.products.forEach((p, i) => {
    const n = p.name.trim() || `Product ${i + 1}`;
    if (!p.name.trim()) errs.push(`Product ${i + 1}: enter a name.`);
    if (!okSrc(p.img)) errs.push(`${n}: upload the first photo.`);
    if (typeof p.priority !== "number" || !(p.priority >= 0)) errs.push(`${n}: enter a display priority (a number, 1 shows first).`);
    if (p.img2 && !okSrc(p.img2)) errs.push(`${n}: the second photo is not valid.`);
    SIZES.forEach(s => {
      const P = p.prices[s];
      if (typeof P.now !== "number" || !(P.now >= 0)) errs.push(`${n} ${s} ml: enter the "now" price.`);
      if (P.before != null && !(P.before >= 0)) errs.push(`${n} ${s} ml: the "before" price is not valid.`);
    });
  });
  const seen = new Set();
  data.shipping.forEach((z, i) => {
    const n = z.name.trim();
    if (!n) errs.push(`Shipping row ${i + 1}: enter the governorate name.`);
    else if (seen.has(n.toLowerCase())) errs.push(`Shipping: "${n}" is listed twice.`);
    else seen.add(n.toLowerCase());
    if (typeof z.fee !== "number" || !(z.fee >= 0)) errs.push(`Shipping ${n || "row " + (i + 1)}: enter the shipping cost (0 for free).`);
  });
  data.reviews.forEach((v, i) => { if (!okSrc(v.src)) errs.push(`Review ${i + 1}: the ${v.type === "image" ? "photo" : "video"} link must start with https://`); });
  return errs;
}
async function save() {
  const errs = validate();
  if (errs.length) { alert("Please fix these before saving:\n\n• " + errs.join("\n• ")); return; }
  sortProducts();
  const out = clone(data);
  out.shipping = out.shipping.map(z => ({ name: z.name.trim(), fee: z.fee }));
  out.products.forEach(p => { if (!p.img2) p.img2 = p.img; SIZES.forEach(s => { if (p.prices[s].before == null) p.prices[s].before = p.prices[s].now; }); if (!p.featured) delete p.featured; });
  out.updatedAt = new Date().toISOString();
  const body = JSON.stringify(out, null, 1); // sent as a raw JSON body (not a form upload)
  busy("Saving…");
  try {
    await api("catalog", { method: "PUT", headers: { "Content-Type": "application/json" }, body });
    saved = JSON.stringify(data);
    busy(); refreshBar("Saved. The site shows the new version on the next page load.", "ok");
  } catch (e) {
    busy(); refreshBar("Not saved: " + (e.message || e), "err");
    if (/row-level security|unauthori|jwt|403/i.test(String(e.message))) alert("Your session may have expired. Sign out, sign in again, then save.");
  }
}
$("#saveBtn").addEventListener("click", save);
$("#discardBtn").addEventListener("click", () => { if (confirm("Discard all unsaved changes?")) { data = JSON.parse(saved); render(); refreshBar(); } });

/* Images are resized in the browser and stored in the site database (D1). Videos need file storage (R2), which is not enabled. */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const MAXD = 1600, k = Math.min(1, MAXD / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      let q = 0.86;
      const tryOut = () => c.toBlob(b => {
        if (!b) return reject(new Error("Could not read this image."));
        if (b.size > 1200 * 1024 && q > 0.4) { q -= 0.12; return tryOut(); }
        b.size > 1200 * 1024 ? reject(new Error("The image is too large even after resizing.")) : resolve(b);
      }, "image/jpeg", q);
      tryOut();
    };
    img.onerror = () => { URL.revokeObjectURL(u); reject(new Error("Could not read this image.")); };
    img.src = u;
  });
}
async function upload(file, kind) {
  if (kind === "video") throw new Error("Video upload is not available yet. Paste a video link instead.");
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Use a JPG, PNG or WebP image.");
  if (file.size > 25 * 1024 * 1024) throw new Error("The file must be under 25 MB.");
  busy("Uploading image…");
  try {
    const blob = await shrinkImage(file);
    const r = await api("upload", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    return r.url;
  } finally { busy(); }
}

          <label class="f"><span>Order status</span><select class="in" data-order-status="${esc(o.id)}">${STATUSES.map(r => `<option value="${r[0]}" ${o.status === r[0] ? "selected" : ""}>${esc(r[1] + " · " + r[2])}</option>`).join("")}</select></label>
          ${o.telegram_sent ? "" : `<p class="err" style="font-size:13px">Telegram notification was not sent${o.telegram_error ? ": " + esc(o.telegram_error) : ""}.</p>`}
          ${o.price_source === "client" ? `<p class="err" style="font-size:13px">Prices on this order were not verified by the server. Check them before confirming.</p>` : ""}
        </div>
      </div>
      <div style="overflow-x:auto"><table class="oi"><thead><tr><th>Item</th><th>Size</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody>
        ${items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.ml ? esc(i.ml) + " ml" : "—"}</td><td class="n">${esc(i.qty)}</td><td class="n">${esc(money(i.unit_price))}</td><td class="n">${esc(money(i.line_total))}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="otot"><div><span>Subtotal</span><span>${esc(money(o.subtotal))}</span></div><div><span>Shipping</span><span>${esc(money(o.shipping))}</span></div><div class="t"><span>Total</span><span>${esc(money(o.total))}</span></div></div>
    </div>
  </details>`;
}

/* ---------- Editing ---------- */
function setPath(path, val) {
  const keys = path.split("."); let o = data;
  for (let k = 0; k < keys.length - 1; k++) o = o[keys[k]];
  o[keys[keys.length - 1]] = val;
}
function getPath(path) { return path.split(".").reduce((o, k) => o[k], data); }
// Remember which product cards are open so a re-render keeps them open.
function keepOpen() { document.querySelectorAll("details.prod").forEach(d => { const p = data.products[d.dataset.i]; if (p) Object.defineProperty(p, "_open", { value: d.open, enumerable: false, configurable: true, writable: true }); }); }

$("#panel").addEventListener("input", e => {
  const el = e.target, k = el.dataset.k;
  if (!k) return;
  if (el.type === "checkbox") setPath(k, el.checked);
  else if ("num" in el.dataset) setPath(k, el.value === "" ? null : Number(el.value));
  else setPath(k, el.value);
  if (/^products\.\d+\.(name|ref|cat)$/.test(k)) {
    const d = el.closest("details.prod"); const p = data.products[d.dataset.i];
    d.querySelector(".nm").textContent = p.name || "New product";
    d.querySelector(".sub").textContent = CAT_LABEL[p.cat] + (p.ref ? " · Inspired by " + p.ref : "");
  }
  refreshBar();
});
$("#panel").addEventListener("change", async e => {
  const el = e.target;
  if (el.matches("[data-k]") && el.type === "checkbox") { keepOpen(); render(); refreshBar(); return; }
  if (el.matches("[data-priority]")) { keepOpen(); sortProducts(); render(); refreshBar(); return; }
  if (el.matches("[data-ofilter]")) return;
  if (el.matches("[data-order-status]")) {
    const id = el.dataset.orderStatus, o = (orders || []).find(x => x.id === id); if (!o) return;
    const prev = o.status, next = el.value;
    el.disabled = true;
    let error = null;
    try { await api("order-status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, status: next }) }); } catch (e) { error = e; }
    if (error) { el.value = prev; el.disabled = false; alert("Could not update the status: " + (error.message || error)); return; }
    o.status = next; updateOrdersBadge();
    const y = window.scrollY; render(); window.scrollTo({ top: y });
    return;
  }
  if (el.matches("[data-href-select]")) {
    const custom = el.value === "custom";
    $("#customHref").hidden = !custom;
    if (!custom) data.banner.href = el.value; else { data.banner.href = ""; $("#customHref input").value = ""; $("#customHref input").focus(); }
    refreshBar(); return;
  }
  if (el.matches("[data-offer]")) {
    const s = el.dataset.offer;
    data.offers = el.checked ? data.products.map(p => p.slug).filter(x => x === s || data.offers.includes(x)) : data.offers.filter(x => x !== s);
    render(); refreshBar(); return;
  }
  if (el.matches("[data-upload]") && el.files[0]) {
    const path = el.dataset.upload;
    try {
      const url = await upload(el.files[0], el.dataset.kind);
      const wasSame = /^products\.\d+\.img$/.test(path) && getPath(path) === getPath(path + "2");
      setPath(path, url);
      if (wasSame) setPath(path + "2", url); // keep photo 2 = photo 1 until a separate photo 2 is uploaded
      keepOpen(); render(); refreshBar();
    } catch (err) { alert(err.message || err); }
    el.value = ""; return;
  }
  if (el.matches("[data-addvideo]") && el.files[0]) {
    try {
      const url = await upload(el.files[0], "video");
      data.reviews.push({ type: "video", src: url, poster: "", title: "" });
      render(); refreshBar();
    } catch (err) { alert(err.message || err); }
    el.value = ""; return;
  }
  if (el.matches("[data-addphoto]") && el.files[0]) {
    try {
      const url = await upload(el.files[0], "img");
      data.reviews.push({ type: "image", src: url, poster: "", title: "" });
      render(); refreshBar();
    } catch (err) { alert(err.message || err); }
    el.value = ""; return;
  }
});
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = Number(b.dataset.i), d = Number(b.dataset.d);
  if (a === "addProduct") {
    const name = prompt("Name of the new product:"); if (!name || !name.trim()) return;
    let base = slugify(name) || "product", slug = base, n = 2;
    while (data.products.some(p => p.slug === slug)) slug = `${base}-${n++}`;
    const prices = {}, available = {};
    SIZES.forEach(s => { prices[s] = { before: null, now: null }; available[s] = true; });
    keepOpen();
    const nextPriority = data.products.reduce((m, x) => Math.max(m, typeof x.priority === "number" ? x.priority : 0), 0) + 1;
    const p = { slug, name: name.trim(), ref: "", cat: "men", img: "", img2: "", featured: false, prices, available, notes: "", notesAr: "", priority: nextPriority };
    Object.defineProperty(p, "_open", { value: true, enumerable: false, configurable: true, writable: true });
    data.products.push(p);
    render(); refreshBar();
    const last = document.querySelector("details.prod:last-of-type"); if (last) last.scrollIntoView({ block: "start" });
    return;
  }
  if (a === "delProduct") {
    const p = data.products[i];
    if (!confirm(`Delete “${p.name}”? It is removed from the site when you save.`)) return;
    data.products.splice(i, 1); data.offers = data.offers.filter(s => s !== p.slug);
    if (data.banner.href === "#product-" + p.slug) data.banner.href = "#shop";
    keepOpen(); render(); refreshBar(); return;
  }
  if (a === "move") { keepOpen(); const [p] = data.products.splice(i, 1); data.products.splice(i + d, 0, p); data.products.forEach((q, k) => { q.priority = k + 1; }); render(); refreshBar(); return; }
  if (a === "vmove") { pendingReviewRemoval = null; const [v] = data.reviews.splice(i, 1); data.reviews.splice(i + d, 0, v); render(); refreshBar(); return; }
  if (a === "refreshOrders") { loadOrders(false); return; }
  if (a === "addShip") { data.shipping.push({ name: "", fee: null }); render(); refreshBar(); const r = document.querySelectorAll("table.sz tbody tr"); if (r.length) r[r.length - 1].querySelector("input").focus(); return; }
  if (a === "addAllShip") {
    const have = new Set(data.shipping.map(z => z.name.trim()));
    GOVERNORATES.forEach(n => { if (!have.has(n)) data.shipping.push({ name: n, fee: null }); });
    render(); refreshBar(); return;
  }
  if (a === "delShip") { data.shipping.splice(i, 1); render(); refreshBar(); return; }
  if (a === "delVideo") { pendingReviewRemoval = i; render(); const keep = document.querySelector(`[data-act="cancelReviewRemoval"][data-i="${i}"]`); keep?.focus(); keep?.scrollIntoView({ block: "center" }); return; }
  if (a === "cancelReviewRemoval") { pendingReviewRemoval = null; render(); document.querySelector(`[data-act="delVideo"][data-i="${i}"]`)?.focus(); return; }
  if (a === "confirmReviewRemoval") { if (pendingReviewRemoval !== i || !data.reviews[i]) return; data.reviews.splice(i, 1); pendingReviewRemoval = null; render(); refreshBar(); document.querySelector(`[data-act="delVideo"][data-i="${Math.min(i, data.reviews.length - 1)}"]`)?.focus(); return; }
  if (a === "clearPoster") { data.reviews[i].poster = ""; render(); refreshBar(); return; }
  if (a === "addVideoUrl") {
    const url = (prompt("Link to a photo (.jpg/.png/.webp) or a video (.mp4/.webm) starting with https://:") || "").trim(); if (!url) return;
    if (!okSrc(url)) { alert("The link must start with https:// and point straight to the file."); return; }
    const type = /\.(jpe?g|png|webp)(\?|#|$)/i.test(url) ? "image" : "video";
    data.reviews.push({ type, src: url, poster: "", title: "" }); render(); refreshBar(); return;
  }
});

$("#panel").addEventListener("click", e => {
  const f = e.target.closest("[data-ofilter]"); if (!f) return;
  ordersFilter = f.dataset.ofilter; render();
});
// Remember which order cards are open so a refresh keeps them open (toggle does not bubble, so listen in the capture phase).
$("#panel").addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.ord")) return;
  if (d.open) ordersOpen.add(d.dataset.oid); else ordersOpen.delete(d.dataset.oid);
}, true);

// Delete an order: right-click (mouse) or long-press (touch) on an order opens a menu with Delete, then an Arabic confirmation.
(() => {
  let menu = null, skipClick = false;
  const closeMenu = () => { if (menu) { menu.remove(); menu = null; } };
  const orderOf = el => { const d = el.closest && el.closest("details.ord"); return d ? (orders || []).find(x => x.id === d.dataset.oid) : null; };
  function confirmDelete(o) {
    const bg = document.createElement("div"); bg.className = "dlg-bg";
    bg.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h3>حذف الطلب</h3>
      <p>هل تريد حذف الطلب رقم <b>${esc(o.order_no)}</b>؟</p><p>العميل: <b>${esc(o.customer_name)}</b></p>
      <p class="warn">سيتم حذف الطلب نهائيًا من لوحة التحكم. لا يمكن التراجع عن هذا الإجراء.</p>
      <div class="row"><button type="button" class="del">حذف نهائيًا</button><button type="button" class="cancel">إلغاء</button></div><p class="warn" id="dlgErr" hidden></p></div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.querySelector(".cancel").onclick = close;
    bg.addEventListener("click", e => { if (e.target === bg) close(); });
    bg.querySelector(".del").onclick = async ev => {
      const btn = ev.currentTarget; btn.disabled = true; btn.textContent = "جارٍ الحذف…";
      try {
        await api("order-delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: o.id }) });
        orders = (orders || []).filter(x => x.id !== o.id); ordersOpen.delete(o.id); close(); render(); updateOrdersBadge && updateOrdersBadge();
      } catch (e) {
        btn.disabled = false; btn.textContent = "حذف نهائيًا";
        const er = bg.querySelector("#dlgErr"); er.hidden = false; er.textContent = "تعذر حذف الطلب. حاول مرة أخرى.";
      }
    };
  }
  function openMenu(o, x, y) {
    closeMenu();
    menu = document.createElement("div"); menu.className = "ctx"; menu.dir = "rtl";
    menu.innerHTML = `<button type="button">حذف الطلب رقم ${esc(o.order_no)}</button>`;
    document.body.appendChild(menu);
    menu.style.left = Math.max(8, Math.min(x, innerWidth - 190)) + "px"; menu.style.top = Math.max(8, Math.min(y, innerHeight - 70)) + "px";
    menu.querySelector("button").onclick = () => { closeMenu(); confirmDelete(o); };
  }
  $("#panel").addEventListener("contextmenu", e => {
    const o = e.target.closest("details.ord > summary") && orderOf(e.target); if (!o) return;
    e.preventDefault(); openMenu(o, e.clientX, e.clientY);
  });
  let timer = null, sx = 0, sy = 0;
  $("#panel").addEventListener("touchstart", e => {
    const s = e.target.closest("details.ord > summary"); const o = s && orderOf(e.target); if (!o) return;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; skipClick = true; openMenu(o, sx, sy); }, 600);
  }, { passive: true });
  const cancelTimer = () => { clearTimeout(timer); timer = null; };
  $("#panel").addEventListener("touchmove", e => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancelTimer(); }, { passive: true });
  $("#panel").addEventListener("touchend", () => { cancelTimer(); setTimeout(() => { skipClick = false; }, 700); });
  $("#panel").addEventListener("touchcancel", cancelTimer);
  // After a long-press, do not toggle the order open.
  $("#panel").addEventListener("click", e => { if (skipClick) { skipClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener("click", e => { if (menu && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
  addEventListener("scroll", closeMenu, { passive: true });
})();

boot();

// Drag and drop reordering for reviews (mouse and touch). The order is the array order, saved with the rest.
(() => {
  let d = null;
  const SEL = ".vitem, details.prod", items = () => [...document.querySelectorAll(d ? d.kind === "products" ? "details.prod" : ".vitem" : SEL)];
  document.addEventListener("click", e => { if (e.target.closest("[data-vgrip]")) { e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener("pointerdown", e => {
    const g = e.target.closest("[data-vgrip]"); if (!g || (e.pointerType === "mouse" && e.button !== 0)) return;
    const kind = g.dataset.vgrip, el = g.closest(kind === "products" ? "details.prod" : ".vitem"); d = { kind }; const list = items(); e.preventDefault();
    d = { kind, el, from: list.indexOf(el), to: list.indexOf(el), y0: e.clientY, sy0: scrollY, id: e.pointerId, y: e.clientY, raf: 0 };
    try { g.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("dragging"); document.body.classList.add("vdragging");
    d.raf = requestAnimationFrame(tick);
  });
  function tick() {
    if (!d) return;
    const vh = innerHeight, edge = 70;
    if (d.y < edge) scrollBy(0, -Math.ceil((edge - d.y) / 4)); else if (d.y > vh - edge) scrollBy(0, Math.ceil((d.y - (vh - edge)) / 4));
    d.el.style.transform = `translateY(${d.y - d.y0 + (scrollY - d.sy0)}px)`;
    const list = items(), cy = d.y + 0; let to = d.from;
    list.forEach((it, k) => { if (it === d.el) return; const r = it.getBoundingClientRect(), mid = r.top + r.height / 2; if (k < d.from && cy < mid) to = Math.min(to, k); if (k > d.from && cy > mid) to = Math.max(to, k); });
    if (to !== d.to || !list.some(i => i.classList.contains("dropbefore") || i.classList.contains("dropafter"))) {
      d.to = to; list.forEach(i => i.classList.remove("dropbefore", "dropafter"));
      if (to !== d.from) list[to].classList.add(to < d.from ? "dropbefore" : "dropafter");
    }
    d.raf = requestAnimationFrame(tick);
  }
  document.addEventListener("pointermove", e => { if (d && e.pointerId === d.id) { d.y = e.clientY; e.preventDefault(); } }, { passive: false });
  const end = (e, cancel) => {
    if (!d || e.pointerId !== d.id) return;
    cancelAnimationFrame(d.raf); const { from, to, kind } = d; d = null;
    document.body.classList.remove("vdragging");
    document.querySelectorAll(SEL).forEach(i => { i.classList.remove("dragging", "dropbefore", "dropafter"); i.style.transform = ""; });
    if (!cancel && from !== to && kind === "products") { keepOpen(); const [p] = data.products.splice(from, 1); data.products.splice(to, 0, p); data.products.forEach((q, k) => { q.priority = k + 1; }); render(); refreshBar(); }
    else if (!cancel && from !== to) { pendingReviewRemoval = null; const [v] = data.reviews.splice(from, 1); data.reviews.splice(to, 0, v); render(); refreshBar(); }
  };
  document.addEventListener("pointerup", e => end(e, false));
  document.addEventListener("pointercancel", e => end(e, true));
})();
</script>
